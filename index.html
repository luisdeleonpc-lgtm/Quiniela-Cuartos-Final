<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiniela Eliminación Directa — Mundial 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{
  --night:#0B1220;
  --surface:#131C2E;
  --surface-2:#1B2740;
  --line:#28344E;
  --gold:#FFD447;
  --red:#FF4757;
  --green:#3DDC97;
  --text:#F5F7FA;
  --muted:#7C8AA3;
  --font-display:'Oswald',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(ellipse at top, #17223A 0%, var(--night) 55%);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold);color:var(--night);}
a{color:var(--gold);}
button{font-family:var(--font-body);cursor:pointer;}
button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.hidden{display:none !important;}

/* ---------- Top bar / floodlight signature ---------- */
.floodbar{
  position:relative;
  height:4px;
  width:100%;
  background:linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent);
  box-shadow:0 0 24px 2px rgba(255,212,71,0.55);
}
header.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px;
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;}
.brand .mark{
  font-family:var(--font-display);
  font-size:13px;letter-spacing:3px;color:var(--night);
  background:var(--gold);
  padding:4px 8px;border-radius:3px;font-weight:600;
}
.brand h1{
  font-family:var(--font-display);
  font-size:20px;font-weight:600;letter-spacing:0.5px;margin:0;
  text-transform:uppercase;
}
.brand h1 span{color:var(--gold);}
.who{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--muted);}
.who b{color:var(--text);}
.btn{
  border:1px solid var(--line);background:var(--surface-2);color:var(--text);
  padding:9px 16px;border-radius:6px;font-size:14px;font-weight:500;
  transition:border-color .15s, transform .1s;
}
.btn:hover{border-color:var(--gold);}
.btn:active{transform:scale(0.98);}
.btn-gold{background:var(--gold);color:var(--night);border-color:var(--gold);font-weight:600;}
.btn-gold:hover{background:#ffdd6a;}
.btn-danger{border-color:var(--red);color:var(--red);background:transparent;}
.btn-danger:hover{background:rgba(255,71,87,0.1);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);}
.btn-ghost:hover{color:var(--text);}
.btn-sm{padding:6px 12px;font-size:12.5px;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

main{max-width:1100px;margin:0 auto;padding:32px 20px 80px;}

/* ---------- Login ---------- */
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.login-card{
  width:100%;max-width:400px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:36px 32px 32px;
  position:relative;overflow:hidden;
}
.login-card::before{
  content:"";position:absolute;top:-40%;right:-30%;width:260px;height:260px;
  background:radial-gradient(circle, rgba(255,212,71,0.16), transparent 70%);
}
.login-eyebrow{
  font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--gold);
  text-transform:uppercase;margin-bottom:6px;
}
.login-card h2{
  font-family:var(--font-display);font-size:28px;margin:0 0 4px;text-transform:uppercase;letter-spacing:0.5px;
}
.login-card p.sub{color:var(--muted);font-size:14px;margin:0 0 26px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;letter-spacing:0.3px;}
.field input, .field select{
  width:100%;background:var(--night);border:1px solid var(--line);
  color:var(--text);padding:11px 12px;border-radius:6px;font-size:15px;font-family:var(--font-body);
}
.field input:focus, .field select:focus{border-color:var(--gold);outline:none;}
.error-msg{
  color:var(--red);font-size:13px;margin:-6px 0 14px;min-height:16px;
}
.login-submit{width:100%;padding:12px;font-size:15px;margin-top:6px;}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:28px;flex-wrap:wrap;}
.tab{
  padding:11px 18px;font-size:14px;color:var(--muted);background:none;border:none;
  border-bottom:2px solid transparent;font-weight:500;
}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.tab:hover{color:var(--text);}

/* ---------- Match cards ---------- */
.section-title{
  font-family:var(--font-display);text-transform:uppercase;letter-spacing:1px;
  font-size:15px;color:var(--muted);margin:32px 0 14px;display:flex;align-items:center;gap:10px;
}
.section-title::after{content:"";flex:1;height:1px;background:var(--line);}
.match-card{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  margin-bottom:16px;overflow:hidden;
}
.match-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;flex-wrap:wrap;gap:10px;
  background:var(--surface-2);
}
.teams{display:flex;align-items:center;gap:14px;font-family:var(--font-display);font-size:20px;text-transform:uppercase;}
.teams .vs{color:var(--muted);font-size:13px;font-family:var(--font-body);}
.match-meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
.tag{
  font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:20px;
  letter-spacing:0.5px;text-transform:uppercase;font-weight:600;
}
.tag-open{background:rgba(61,220,151,0.15);color:var(--green);}
.tag-locked{background:rgba(255,71,87,0.15);color:var(--red);}
.match-body{padding:20px;}

.stage-row{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;
}
.stage-label{font-size:13px;color:var(--muted);min-width:150px;font-weight:500;}
.score-inputs{display:flex;align-items:center;gap:8px;}
.score-inputs input{
  width:56px;text-align:center;background:var(--night);border:1px solid var(--line);
  color:var(--text);padding:9px 4px;border-radius:6px;font-family:var(--font-mono);font-size:16px;font-weight:600;
}
.score-inputs input:disabled{opacity:0.45;}
.score-inputs .dash{color:var(--muted);font-family:var(--font-mono);}
.toggle-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:12px;}
.toggle-line input{accent-color:var(--gold);}

/* penalty order widget — signature element */
.pen-order-block{
  background:var(--night);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:10px;
}
.pen-team{margin-bottom:12px;}
.pen-team:last-child{margin-bottom:0;}
.pen-team .lbl{font-size:12.5px;color:var(--muted);margin-bottom:6px;}
.pen-dots{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.pen-dot{
  width:34px;height:34px;border-radius:50%;border:2px solid var(--line);
  background:var(--surface);color:var(--muted);font-family:var(--font-mono);font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;transition:.12s;
}
.pen-dot[data-v="hit"]{border-color:var(--green);color:var(--green);background:rgba(61,220,151,0.12);}
.pen-dot[data-v="miss"]{border-color:var(--red);color:var(--red);background:rgba(255,71,87,0.12);}
.pen-dot-add,.pen-dot-remove{
  width:34px;height:34px;border-radius:50%;border:1px dashed var(--line);background:transparent;color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.pen-dot-add:hover,.pen-dot-remove:hover{border-color:var(--gold);color:var(--gold);}

.save-row{display:flex;align-items:center;gap:12px;margin-top:16px;}
.save-hint{font-size:12.5px;color:var(--muted);}

.points-pill{
  font-family:var(--font-mono);font-weight:700;font-size:15px;color:var(--gold);
  background:rgba(255,212,71,0.1);padding:6px 12px;border-radius:20px;
}
.breakdown{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.7;}
.breakdown b{color:var(--text);}

/* ---------- Admin: participants ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:20px;}
.panel h3{font-family:var(--font-display);text-transform:uppercase;font-size:16px;margin:0 0 16px;letter-spacing:0.5px;}
.inline-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px;}
.inline-form .field{margin-bottom:0;flex:1;min-width:180px;}
table.roster{width:100%;border-collapse:collapse;font-size:14px;}
table.roster th{
  text-align:left;color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;
  letter-spacing:0.5px;padding:8px 10px;border-bottom:1px solid var(--line);
}
table.roster td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.roster tr:last-child td{border-bottom:none;}
.cred{font-family:var(--font-mono);background:var(--night);padding:3px 8px;border-radius:5px;font-size:13px;}
.copy-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.rank{
  width:26px;height:26px;border-radius:50%;background:var(--surface-2);color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:700;
}
.rank.gold{background:var(--gold);color:var(--night);}
.rank.silver{background:#C9D2E0;color:var(--night);}
.rank.bronze{background:#C8804A;color:var(--night);}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(4,8,18,0.7);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
}
.modal{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  max-width:520px;width:100%;max-height:85vh;overflow-y:auto;padding:28px;
}
.modal h2{font-family:var(--font-display);text-transform:uppercase;font-size:20px;margin:0 0 4px;}
.modal .close-row{display:flex;justify-content:flex-end;margin-top:20px;}
.rule-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:16px;}
.rule-row:last-child{border-bottom:none;}
.rule-row .pts{font-family:var(--font-mono);color:var(--gold);font-weight:700;white-space:nowrap;}
.rule-group-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:18px 0 4px;}
.rule-group-title:first-child{margin-top:0;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--surface-2);border:1px solid var(--gold);color:var(--text);
  padding:12px 20px;border-radius:8px;font-size:14px;z-index:100;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
}

@media (max-width:640px){
  header.top{padding:14px 16px;}
  .brand h1{font-size:16px;}
  main{padding:20px 12px 60px;}
  .teams{font-size:17px;}
  .inline-form .field{min-width:100%;}
}

/* ---------- Poster-style match card (v2) ---------- */
.mc{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;margin-bottom:28px;
}
.mc-topline{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;flex-wrap:wrap;gap:8px;
  border-bottom:1px solid var(--line);
}
.mc-phase{
  display:flex;align-items:center;gap:8px;font-family:var(--font-display);
  color:var(--gold);text-transform:uppercase;letter-spacing:2px;font-size:13px;font-weight:600;
}
.mc-phase svg{flex-shrink:0;}
.mc-when{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
.mc-teams-row{
  text-align:center;padding:18px 16px 14px;
}
.mc-teams-row .names{
  font-family:var(--font-display);text-transform:uppercase;font-size:clamp(22px,5vw,34px);
  letter-spacing:0.5px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
}
.mc-teams-row .names .vsx{
  font-family:var(--font-body);font-size:13px;color:var(--muted);font-weight:600;
  background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;
}
.mc-photos{
  display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
}
.mc-photo{
  position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--night);
}
.mc-photo img{
  width:100%;height:100%;object-fit:cover;object-position:top center;display:block;
}
.mc-photo::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to top, rgba(11,18,32,0.92) 0%, rgba(11,18,32,0.15) 45%, transparent 65%);
}
.mc-photo .lbl{
  position:absolute;left:14px;bottom:12px;z-index:2;
  font-family:var(--font-display);text-transform:uppercase;letter-spacing:1px;
  font-size:15px;color:var(--text);display:flex;align-items:center;gap:8px;
}
.mc-photo .lbl .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.mc-info-bar{
  display:flex;gap:0;border-bottom:1px solid var(--line);
}
.mc-info-item{
  flex:1;padding:12px 16px;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:3px;
}
.mc-info-item:last-child{border-right:none;}
.mc-info-item b{color:var(--text);font-size:13.5px;font-weight:600;}
.mc-body-inner{padding:22px 20px;}
.predict-title{
  text-align:center;font-family:var(--font-display);text-transform:uppercase;letter-spacing:2px;
  font-size:13px;color:var(--muted);margin-bottom:16px;position:relative;
}
.predict-row{
  display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:20px;
}
.predict-team{display:flex;align-items:center;gap:10px;font-family:var(--font-display);text-transform:uppercase;font-size:15px;}
.predict-team img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--line);}
.predict-team.right{flex-direction:row-reverse;}
.stage-card{
  border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;
  display:flex;align-items:flex-start;gap:12px;background:var(--surface-2);
}
.stage-card .ico{
  width:34px;height:34px;border-radius:8px;background:var(--night);display:flex;align-items:center;
  justify-content:center;flex-shrink:0;
}
.stage-card .txt{flex:1;}
.stage-card .txt .t{font-size:14px;font-weight:600;}
.stage-card .txt .d{font-size:12.5px;color:var(--muted);margin-top:2px;}
.stage-card input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);margin-top:2px;}
.mc-footer{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
  padding-top:16px;border-top:1px solid var(--line);
}
.mc-footer-info{display:flex;gap:22px;flex-wrap:wrap;font-size:12px;color:var(--muted);}
.mc-footer-info div b{display:block;color:var(--text);font-size:13.5px;font-weight:600;}
.mc-tagline{
  text-align:center;font-size:12.5px;color:var(--muted);padding:12px 20px 18px;
}
.mc-tagline .gold{color:var(--gold);font-weight:600;}
@media (max-width:560px){
  .mc-info-bar{flex-wrap:wrap;}
  .mc-info-item{flex:1 1 50%;border-bottom:1px solid var(--line);}
  .predict-row{gap:10px;}
}

/* ---------- Welcome screen ---------- */
.welcome-wrap{
  min-height:100vh;position:relative;display:flex;align-items:center;justify-content:center;
  padding:40px 20px;
  background-image:linear-gradient(rgba(6,10,20,0.55), rgba(6,10,20,0.88)), url('estadio-bienvenida.jpg');
  background-size:cover;background-position:center;
}
.welcome-card{
  max-width:560px;width:100%;background:rgba(19,28,46,0.88);
  border:1px solid rgba(255,212,71,0.35);border-radius:16px;
  padding:38px 34px 30px;backdrop-filter:blur(4px);
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.welcome-eyebrow{
  text-align:center;font-family:var(--font-mono);font-size:11px;letter-spacing:3px;
  color:var(--gold);text-transform:uppercase;margin-bottom:10px;
}
.welcome-title{
  text-align:center;font-family:var(--font-display);text-transform:uppercase;
  font-size:clamp(24px,5vw,34px);line-height:1.15;margin:0 0 22px;letter-spacing:0.5px;
}
.welcome-title span{color:var(--gold);}
.welcome-section{margin-bottom:20px;}
.welcome-section h4{
  font-family:var(--font-display);text-transform:uppercase;letter-spacing:1px;
  font-size:13px;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px;
}
.welcome-rules .rule-row{font-size:13.5px;padding:8px 0;}
.prize-box{
  display:flex;align-items:center;gap:14px;background:rgba(255,212,71,0.08);
  border:1px solid rgba(255,212,71,0.3);border-radius:10px;padding:14px 16px;
}
.prize-box .ico{font-size:26px;}
.prize-box .txt b{display:block;color:var(--gold);font-size:15px;font-family:var(--font-display);letter-spacing:0.5px;}
.prize-box .txt span{font-size:12.5px;color:var(--muted);}
.welcome-start-btn{
  width:100%;padding:14px;font-size:16px;margin-top:24px;
}
.welcome-footer{
  text-align:center;font-size:12.5px;color:var(--muted);font-style:italic;margin-top:20px;
  padding-top:16px;border-top:1px solid var(--line);
}
</style>

/* ======================================================================

   ====================================================================== */
function ensureSeed(){
  db.ref("matches").once("value").then(snap=>{
    const existing = snap.val() || {};
    const updates = {};
    Object.keys(SEED_MATCHES).forEach(id=>{
      const merged = Object.assign({}, SEED_MATCHES[id], existing[id]||{});
      // keep seed's metadata authoritative, but preserve any admin-entered result
      Object.assign(merged, SEED_MATCHES[id]);
      if(existing[id] && existing[id].result) merged.result = existing[id].result;
      updates[id] = merged;
    });
    db.ref("matches").update(updates);
  });
  db.ref("users").once("value").then(snap=>{
    if(!snap.exists()){
      db.ref("users/admin").set(DEFAULT_ADMIN);
    }
  });
}

function genUsername(name, existing){
  const clean = name.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z\s]/g,"").trim().split(/\s+/).filter(Boolean);
  const first = clean[0] || "jugador";
  const rest = clean.slice(1).join("");
  let base = rest ? `${first}-${rest}` : first;
  base = base.replace(/[.#$\[\]]/g, "");
  let candidate = base;
  let n = 1;
  while(existing[candidate]){
    n++;
    candidate = base + n;
  }
  return candidate;
}
function genPassword(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  for(let i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}
function isLocked(match){
  return new Date() >= new Date(match.kickoff);
}
function fmtScore(s){
  if(s==null || s.a===undefined || s.a===null || s.a==="" ) return null;
  return `${s.a}-${s.b}`;
}

/* ======================================================================
   CÁLCULO DE PUNTOS
   Reglas:
   Base (sobre 90 min): ganador/empate = 3, gol por equipo acertado = 1 c/u,
   marcador exacto = 5.
   Bonus: marcador exacto 90' = 1, marcador exacto en tiempo extra
   (solo si hubo ET) = 1, marcador exacto en penales (solo si hubo penales) = 1,
   orden exacto de penales acertado/fallado por equipo = 2 c/u.
   ====================================================================== */
function computeMatchPoints(pred, result){
  if(!pred || !result || result.reg==null || result.reg.a===undefined || result.reg.a==="") return {total:0, lines:[]};
  const lines = [];
  let total = 0;
  const reg = result.reg;
  const predReg = pred.reg;

  if(predReg && predReg.a!==undefined && predReg.a!==""){
    // ganador o empate
    const realOutcome = Math.sign(reg.a - reg.b);
    const predOutcome = Math.sign(Number(predReg.a) - Number(predReg.b));
    if(realOutcome === predOutcome){
      total += 3; lines.push("Ganador/empate (90') acertado: +3");
    }
    // goles por equipo
    let golesOk = 0;
    if(Number(predReg.a) === Number(reg.a)){ total += 1; golesOk++; }
    if(Number(predReg.b) === Number(reg.b)){ total += 1; golesOk++; }
    if(golesOk>0) lines.push(`Goles por equipo acertados (${golesOk}): +${golesOk}`);
    // marcador exacto (base)
    if(Number(predReg.a)===Number(reg.a) && Number(predReg.b)===Number(reg.b)){
      total += 5; lines.push("Marcador exacto: +5");
      total += 1; lines.push("Bonus marcador 90 minutos: +1");
    }
  }

  // tiempo extra
  if(result.et && result.et.a!==undefined && result.et.a!==null && result.et.a!==""){
    if(pred.et && pred.et.a!==undefined && pred.et.a!==""){
      if(Number(pred.et.a)===Number(result.et.a) && Number(pred.et.b)===Number(result.et.b)){
        total += 1; lines.push("Bonus marcador tiempo extra: +1");
      }
    }
  }

  // penales (marcador)
  if(result.pen && result.pen.a!==undefined && result.pen.a!==null && result.pen.a!==""){
    if(pred.pen && pred.pen.a!==undefined && pred.pen.a!==""){
      if(Number(pred.pen.a)===Number(result.pen.a) && Number(pred.pen.b)===Number(result.pen.b)){
        total += 1; lines.push("Bonus marcador penales: +1");
      }
    }
    // orden de penales
    if(result.penOrderA && pred.penOrderA && arraysEqual(result.penOrderA, pred.penOrderA)){
      total += 2; lines.push("Orden de penales — equipo A: +2");
    }
    if(result.penOrderB && pred.penOrderB && arraysEqual(result.penOrderB, pred.penOrderB)){
      total += 2; lines.push("Orden de penales — equipo B: +2");
    }
  }

  return {total, lines};
}
function arraysEqual(a,b){
  if(!a || !b || a.length!==b.length) return false;
  return a.every((v,i)=>v===b[i]);
}

function renderPlayerMatchCard(id, match){
  const locked = isLocked(match);

  const colorB = TEAM_COLORS[match.teamB] || "#7C8AA3";
  const imgA = TEAM_IMAGES[match.teamA] || "";
  const imgB = TEAM_IMAGES[match.teamB] || "";

  card.innerHTML = `
    <div class="mc-topline">
      <div class="mc-phase">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M8 21h8M12 17v4M5 3h14v4a7 7 0 0 1-14 0V3ZM5 5H3a2 2 0 0 0 2 2M19 5h2a2 2 0 0 1-2 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        ${match.phase || ''}
      </div>
      <div class="mc-when">
        <span>📅 ${match.label}</span>
        <span class="tag ${locked?'tag-locked':'tag-open'}">${locked?'Cerrado':'Abierto'}</span>
      </div>
    </div>

    <div class="mc-teams-row">
      <div class="names">
        <span>${match.teamA}</span>
        <span class="vsx">VS</span>
        <span>${match.teamB}</span>
      </div>
    </div>

    <div class="mc-photos">
      <div class="mc-photo">
        ${imgA?`<img src="${imgA}" alt="${match.teamA}">`:''}
        <div class="lbl"><span class="dot" style="background:${colorA}"></span>${match.teamA}</div>
      </div>
      <div class="mc-photo">
        ${imgB?`<img src="${imgB}" alt="${match.teamB}">`:''}
        <div class="lbl"><span class="dot" style="background:${colorB}"></span>${match.teamB}</div>
      </div>
    </div>

    <div class="mc-info-bar">
      <div class="mc-info-item"><span>FASE</span><b>${match.phase||'—'}</b></div>
      <div class="mc-info-item"><span>SEDE</span><b>${match.venue||'Por confirmar'}</b></div>
      <div class="mc-info-item"><span>FECHA</span><b>${match.fecha||''}</b></div>
      <div class="mc-info-item"><span>HORA</span><b>${match.hora||''}</b></div>
    </div>

    <div class="mc-body-inner">
      <div class="predict-title">Predice el marcador</div>
      <div class="predict-row">
        <div class="predict-team">${imgA?`<img src="${imgA}" alt="">`:''}<span>${match.teamA}</span></div>
        <div class="score-inputs">
          <input type="number" min="0" id="${id}-rega" value="${myPred.reg?myPred.reg.a:''}" ${locked?'disabled':''}>
          <span class="dash">–</span>
          <input type="number" min="0" id="${id}-regb" value="${myPred.reg?myPred.reg.b:''}" ${locked?'disabled':''}>
        </div>
        <div class="predict-team right">${imgB?`<img src="${imgB}" alt="">`:''}<span>${match.teamB}</span></div>
      </div>

      <div class="stage-card">
        <div class="ico">⏱️</div>
        <div class="txt">
          <div class="t">Tiempo extra</div>
          <div class="d">Creo que va a tiempo extra — predecir marcador de tiempo extra</div>
          <div class="stage-row ${myPred.et?'':'hidden'}" id="${id}-et-row" style="margin-top:10px;">
            <div class="score-inputs">
              <input type="number" min="0" id="${id}-eta" value="${myPred.et?myPred.et.a:''}" ${locked?'disabled':''}>
              <span class="dash">–</span>
              <input type="number" min="0" id="${id}-etb" value="${myPred.et?myPred.et.b:''}" ${locked?'disabled':''}>
            </div>
          </div>
        </div>
        <input type="checkbox" id="${id}-et-toggle" ${myPred.et?'checked':''} ${locked?'disabled':''}>
      </div>

      <div class="stage-card">
        <div class="ico">🎯</div>
        <div class="txt">
          <div class="t">Penales</div>
          <div class="d">Creo que se define en penales — predecir penales</div>
          <div class="${myPred.pen?'':'hidden'}" id="${id}-pen-block" style="margin-top:10px;">
            <div class="score-inputs" style="margin-bottom:12px;">
              <input type="number" min="0" id="${id}-pena" value="${myPred.pen?myPred.pen.a:''}" ${locked?'disabled':''}>

              </div>

          </div>

        <input type="checkbox" id="${id}-pen-toggle" ${myPred.pen?'checked':''} ${locked?'disabled':''}>

  function renderDots(team){
    const wrap = card.querySelector(`#${id}-pen${team}-dots`);
    wrap.innerHTML = "";
    penState[team].forEach((v,i)=>{
      const dot = document.createElement(locked?'span':'button');
      dot.className = "pen-dot";
      dot.dataset.v = v;
      dot.textContent = v==="hit" ? "✓" : "✗";
      if(!locked){
        dot.onclick = ()=>{ penState[team][i] = v==="hit" ? "miss" : "hit"; renderDots(team); };
      }
      wrap.appendChild(dot);
    });
    if(!locked){
      if(penState[team].length < 8){
        const add = document.createElement("button");
        add.className = "pen-dot-add"; add.textContent = "+";
        add.onclick = ()=>{ penState[team].push("hit"); renderDots(team); };
        wrap.appendChild(add);
      }
      if(penState[team].length > 0){
        const rem = document.createElement("button");
        rem.className = "pen-dot-remove"; rem.textContent = "–";
        rem.onclick = ()=>{ penState[team].pop(); renderDots(team); };
        wrap.appendChild(rem);
      }
    }
  }
  renderDots("A"); renderDots("B");

  if(!locked){
    card.querySelector(`#${id}-et-toggle`).onchange = (e)=>{
      card.querySelector(`#${id}-et-row`).classList.toggle("hidden", !e.target.checked);
    };
    card.querySelector(`#${id}-pen-toggle`).onchange = (e)=>{
      card.querySelector(`#${id}-pen-block`).classList.toggle("hidden", !e.target.checked);
    };

      const rega = card.querySelector(`#${id}-rega`).value;

      if(rega==="" || regb===""){ toast("Ingresa el marcador de 90 minutos."); return; }
      const pred = { reg: { a:Number(rega), b:Number(regb) } };
      if(card.querySelector(`#${id}-et-toggle`).checked){
        const eta = card.querySelector(`#${id}-eta`).value, etb = card.querySelector(`#${id}-etb`).value;
        if(eta!=="" && etb!=="") pred.et = { a:Number(eta), b:Number(etb) };
      }
      if(card.querySelector(`#${id}-pen-toggle`).checked){
        const pa = card.querySelector(`#${id}-pena`).value, pb = card.querySelector(`#${id}-penb`).value;
        if(pa!=="" && pb!=="") pred.pen = { a:Number(pa), b:Number(pb) };
        pred.penOrderA = penState.A.slice();
        pred.penOrderB = penState.B.slice();
      }
      db.ref(`predictions/${CURRENT_USER.username}/${id}`).set(pred).then(()=>{
        toast("Predicción guardada.");
      });
    };
  }

  return card;
}

          </div>
        ` : ''}
      </div>
    </div>
    <div class="panel">
      <h3>Participantes (${players.length})</h3>
      <table class="roster">
        <thead><tr><th>Nombre</th><th>Usuario</th><th>Contraseña</th><th></th></tr></thead>
        <tbody>
          ${players.map(([u,r])=>`
            <tr>
              <td>${r.name}</td>
              <td><span class="cred">${u}</span></td>
              <td><span class="cred">${r.password}</span></td>
              <td><button class="btn btn-danger btn-sm" data-del="${u}">Eliminar</button></td>
            </tr>
          `).join("") || `<tr><td colspan="4" style="color:var(--muted);">Aún no hay participantes.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;

  if(lastCreatedCred){
    wrap.querySelector("#copy-cred").onclick = ()=>{
      const c = lastCreatedCred;
      const msg = `¡Hola ${c.name}! Tus accesos para la quiniela del Mundial:\nUsuario: ${c.username}\nContraseña: ${c.password}\nEntra aquí: ${location.href}`;
      navigator.clipboard.writeText(msg).then(()=>toast("Mensaje copiado."));
    };
  }

  wrap.querySelector("#add-participant").onclick = ()=>{
    const nameInput = wrap.querySelector("#new-name");
    const name = nameInput.value.trim();
    if(!name){ toast("Escribe el nombre del participante."); return; }
    const username = genUsername(name, USERS);
    const password = genPassword();
    const addBtn = wrap.querySelector("#add-participant");
    addBtn.disabled = true;
    addBtn.textContent = "Guardando...";
    db.ref("users/"+username).set({ username, name, password, role:"player" }).then(()=>{
      lastCreatedCred = { name, username, password };
      toast("Participante creado.");
      renderAdmin();
    }).catch(err=>{
      addBtn.disabled = false;
      addBtn.textContent = "Generar credenciales";
      wrap.querySelector("#new-cred-box").innerHTML = `
        <div class="panel" style="margin-top:14px;border-color:var(--red);">
          <b style="color:var(--red);">No se pudo guardar el participante.</b>
          <div class="breakdown" style="margin-top:8px;">Detalle: ${err.message}<br>
          Revisa que reemplazaste el <b>firebaseConfig</b> con los datos reales de tu proyecto de Firebase,
          y que las reglas de la Realtime Database permiten lectura y escritura (".read": true, ".write": true).</div>
        </div>
      `;
      toast("Error al guardar. Revisa la configuración de Firebase.");
    });
  };

  wrap.querySelectorAll("[data-del]").forEach(btn=>{
    btn.onclick = ()=>{
      const u = btn.dataset.del;
      if(confirm(`¿Eliminar a ${USERS[u].name}? Esto también borrará sus predicciones.`)){
        db.ref("users/"+u).remove();
        db.ref("predictions/"+u).remove();
      }
    };
  });

  return wrap;
}

function renderMatchesPanel(){
  const wrap = document.createElement("div");
  Object.keys(MATCHES).sort().forEach(id=>{
    wrap.appendChild(renderAdminMatchCard(id, MATCHES[id]));
  });
  return wrap;
}

function renderAdminMatchCard(id, match){
  const r = match.result || {};
  const card = document.createElement("div");
  card.className = "match-card";
  card.innerHTML = `
    <div class="match-head">
      <div class="teams">${match.teamA} <span class="vs">vs</span> ${match.teamB}</div>
      <div class="match-meta"><span>${match.label}</span></div>
    </div>
    <div class="match-body">
      <div class="stage-row">
        <span class="stage-label">Marcador 90 minutos</span>
        <div class="score-inputs">
          <input type="number" min="0" id="${id}-rega" value="${r.reg?r.reg.a:''}">
          <span class="dash">–</span>
          <input type="number" min="0" id="${id}-regb" value="${r.reg?r.reg.b:''}">
        </div>
      </div>
      <label class="toggle-line"><input type="checkbox" id="${id}-et-toggle" ${r.et?'checked':''}> ¿Fue a tiempo extra?</label>
      <div class="stage-row ${r.et?'':'hidden'}" id="${id}-et-row">
        <span class="stage-label">Marcador tiempo extra</span>
        <div class="score-inputs">
          <input type="number" min="0" id="${id}-eta" value="${r.et?r.et.a:''}">
          <span class="dash">–</span>
          <input type="number" min="0" id="${id}-etb" value="${r.et?r.et.b:''}">
        </div>
      </div>
      <label class="toggle-line"><input type="checkbox" id="${id}-pen-toggle" ${r.pen?'checked':''}> ¿Se definió en penales?</label>
      <div class="${r.pen?'':'hidden'}" id="${id}-pen-block">
        <div class="stage-row">
          <span class="stage-label">Marcador de penales</span>
          <div class="score-inputs">
            <input type="number" min="0" id="${id}-pena" value="${r.pen?r.pen.a:''}">
            <span class="dash">–</span>
            <input type="number" min="0" id="${id}-penb" value="${r.pen?r.pen.b:''}">
          </div>
        </div>
        <div class="pen-order-block">
          <div class="pen-team">
            <div class="lbl">Orden real ${match.teamA}</div>
            <div class="pen-dots" id="${id}-penA-dots"></div>
          </div>
          <div class="pen-team">
            <div class="lbl">Orden real ${match.teamB}</div>
            <div class="pen-dots" id="${id}-penB-dots"></div>
          </div>
        </div>
      </div>
      <div class="save-row">
        <button class="btn btn-gold btn-sm" id="${id}-save-result">Guardar resultado</button>
      </div>
    </div>
  `;

  const penState = { A: (r.penOrderA||[]).slice(), B: (r.penOrderB||[]).slice() };
  function renderDots(team){
    const wrap2 = card.querySelector(`#${id}-pen${team}-dots`);
    wrap2.innerHTML = "";
    penState[team].forEach((v,i)=>{
      const dot = document.createElement("button");
      dot.className = "pen-dot"; dot.dataset.v = v;
      dot.textContent = v==="hit"?"✓":"✗";
      dot.onclick = ()=>{ penState[team][i] = v==="hit"?"miss":"hit"; renderDots(team); };
      wrap2.appendChild(dot);
    });
    const add = document.createElement("button");
    add.className = "pen-dot-add"; add.textContent = "+";
    add.onclick = ()=>{ penState[team].push("hit"); renderDots(team); };
    wrap2.appendChild(add);
    if(penState[team].length>0){
      const rem = document.createElement("button");
      rem.className = "pen-dot-remove"; rem.textContent = "–";
      rem.onclick = ()=>{ penState[team].pop(); renderDots(team); };
      wrap2.appendChild(rem);
    }
  }
  renderDots("A"); renderDots("B");

  card.querySelector(`#${id}-et-toggle`).onchange = e=>card.querySelector(`#${id}-et-row`).classList.toggle("hidden", !e.target.checked);
  card.querySelector(`#${id}-pen-toggle`).onchange = e=>card.querySelector(`#${id}-pen-block`).classList.toggle("hidden", !e.target.checked);

  card.querySelector(`#${id}-save-result`).onclick = ()=>{
    const rega = card.querySelector(`#${id}-rega`).value, regb = card.querySelector(`#${id}-regb`).value;
    if(rega==="" || regb===""){ toast("Ingresa el marcador de 90 minutos."); return; }
    const result = { reg:{a:Number(rega), b:Number(regb)} };
    if(card.querySelector(`#${id}-et-toggle`).checked){
      const eta=card.querySelector(`#${id}-eta`).value, etb=card.querySelector(`#${id}-etb`).value;
      if(eta!=="" && etb!=="") result.et = {a:Number(eta), b:Number(etb)};
    }
    if(card.querySelector(`#${id}-pen-toggle`).checked){
      const pa=card.querySelector(`#${id}-pena`).value, pb=card.querySelector(`#${id}-penb`).value;
      if(pa!=="" && pb!=="") result.pen = {a:Number(pa), b:Number(pb)};
      result.penOrderA = penState.A.slice();
      result.penOrderB = penState.B.slice();
    }
    db.ref(`matches/${id}/result`).set(result).then(()=>toast("Resultado guardado."));
  };

  return card;
}

function renderLeaderboardPanel(){
  const wrap = document.createElement("div");
  const players = Object.entries(USERS).filter(([u,r])=>r.role!=="admin");
  const scored = players.map(([u,r])=>{
    let total = 0;
    Object.keys(MATCHES).forEach(id=>{
      const match = MATCHES[id];
      if(match.result){
        const pred = (PREDICTIONS[u]||{})[id];
        total += computeMatchPoints(pred, match.result).total;
      }
    });
    return { username:u, name:r.name, total };
  }).sort((a,b)=>b.total-a.total);

  wrap.innerHTML = `
    <div class="panel">
      <h3>Tabla de posiciones</h3>
      <table class="roster">
        <thead><tr><th>#</th><th>Participante</th><th>Puntos</th></tr></thead>
        <tbody>
          ${scored.map((s,i)=>`
            <tr>
              <td><span class="rank ${i===0?'gold':i===1?'silver':i===2?'bronze':''}">${i+1}</span></td>
              <td>${s.name}</td>
              <td class="cred">${s.total}</td>
            </tr>
          `).join("") || `<tr><td colspan="3" style="color:var(--muted);">Aún no hay participantes.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  return wrap;
}

/* ======================================================================
   BOOT
   ====================================================================== */
function boot(){
  if(!CURRENT_USER){
    renderLogin("");
    return;
  }
  Promise.all([
    db.ref("matches").once("value"),
    db.ref("users").once("value"),
    db.ref("predictions").once("value"),
  ]).then(([mSnap,uSnap,pSnap])=>{
    MATCHES = mSnap.val() || {};
    USERS = uSnap.val() || {};
    PREDICTIONS = pSnap.val() || {};
    if(CURRENT_USER.role === "admin"){
      renderAdmin();
    } else {
      renderPlayer();
    }
  });

  // live updates for matches/results while a session is active
  db.ref("matches").on("value", snap=>{
    MATCHES = snap.val() || {};
    if(CURRENT_USER){
      if(CURRENT_USER.role==="admin" && adminTab==="matches") renderAdmin();
      if(CURRENT_USER.role==="player") renderPlayer();
    }
  });
  db.ref("users").on("value", snap=>{
    USERS = snap.val() || {};
    if(CURRENT_USER && CURRENT_USER.role==="admin" && (adminTab==="participants" || adminTab==="leaderboard")){
      renderAdmin();
    }
  });
  db.ref("predictions").on("value", snap=>{
    PREDICTIONS = snap.val() || {};
    if(CURRENT_USER && CURRENT_USER.role==="admin" && adminTab==="leaderboard"){
      renderAdmin();
    }
  });
}

ensureSeed();
boot();
</script>
</body>
</html>
